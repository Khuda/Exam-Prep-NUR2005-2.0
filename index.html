<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#173B57" />
  <meta name="description" content="NUR2005 Applied Pathophysiology and Pharmacology exam revision: topics, MCQs, short answers, medication calculations and mock exams." />
  <title>NUR2005 Exam Prep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">N2</div>
        <div>
          <p class="eyebrow">Applied pathophysiology</p>
          <h1>NUR2005<br /><span>Exam Prep</span></h1>
        </div>
      </div>
      <button class="sidebar-close" id="sidebarClose" aria-label="Close navigation">×</button>
      <nav class="main-nav" aria-label="Primary navigation">
        <button class="nav-item active" data-view="dashboard"><span>◈</span> Overview</button>
        <button class="nav-item" data-view="topics"><span>▤</span> Topic notes</button>
        <button class="nav-item" data-view="practice"><span>✓</span> MCQ practice</button>
        <button class="nav-item" data-view="shortAnswers"><span>▣</span> Short answers</button>
        <button class="nav-item" data-view="calculations"><span>∑</span> Calculations</button>
        <button class="nav-item" data-view="mockExam"><span>◷</span> Mock exam</button>
        <button class="nav-item" data-view="review"><span>↺</span> Review queue <b id="reviewCount" class="nav-count">0</b></button>
      </nav>
      <div class="sidebar-footer">
        <div class="streak-card"><span class="streak-icon">✦</span><div><strong id="streakValue">0 day</strong><small>study streak</small></div></div>
        <button class="reset-button" id="resetProgress">Reset progress</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button>
        <div class="breadcrumb"><span>Semester 2 · 2026</span><i>/</i><strong id="currentViewLabel">Overview</strong></div>
        <div class="top-actions"><span class="exam-chip"><span class="pulse-dot"></span> Exam: 10 Nov 2026</span><button class="icon-button" id="focusButton" title="Focus mode">⌘</button></div>
      </header>
      <div id="app" class="page-wrap"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
